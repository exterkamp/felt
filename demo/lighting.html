<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>felt — lighting and materials</title>
    <style>
      @font-face { font-family: 'Cinzel'; src: url('./fonts/cinzel-latin.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
      @font-face { font-family: 'Jost'; src: url('./fonts/jost-latin.woff2') format('woff2'); font-weight: 300 700; font-display: block; }
      @font-face { font-family: 'Archivo'; src: url('./fonts/archivo-latin.woff2') format('woff2'); font-weight: 500 700; font-display: block; }
      html, body { margin: 0; height: 100%; background: #0b2119; color: #cfead0; font-family: 'Jost', system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 0.8rem; box-sizing: border-box; }
      h1 { font-family: 'Cinzel', Georgia, serif; font-size: 1.1rem; letter-spacing: 0.06em; margin: 0; color: #fdfdfd; text-transform: uppercase; }
      p { margin: 0; font-size: 0.8rem; text-align: center; max-width: 32rem; color: #9fc4a4; }
      a { color: #ffd166; font-size: 0.8rem; }
      #board { width: min(480px, 100%); flex: 1; touch-action: none; }
      .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
      button {
        font-family: 'Cinzel', Georgia, serif; font-size: 0.75rem; letter-spacing: 0.05em;
        text-transform: uppercase; color: #fdfdfd; background: #17594a;
        border: 1px solid #cfead0; border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer;
      }
      .home {
        position: fixed; top: 0.55rem; left: 0.6rem; z-index: 20;
        font-family: 'Cinzel', Georgia, serif; font-size: 0.66rem;
        letter-spacing: 0.05em; text-transform: uppercase; text-decoration: none;
        color: #fdfdfd; background: #17594a; border: 1px solid #cfead0;
        border-radius: 4px; padding: 0.28rem 0.5rem; line-height: 1;
      }
      .home:hover, .home:focus-visible { border-color: #ffd166; color: #ffd166; }
          label { font-size: 0.72rem; display: flex; align-items: center; gap: 0.35rem; color: #9fc4a4; }
      input[type=range] { width: 6.5rem; accent-color: #ffd166; }
      label code { font-size: 0.68rem; color: #cfead0; font-family: ui-monospace, monospace; min-width: 2.2rem; }
      select { font-family: 'Jost', sans-serif; font-size: 0.72rem; padding: 0.25rem; border-radius: 4px; border: 1px solid #cfead0; background: #17594a; color: #fdfdfd; }
    </style>
  </head>
  <body>
    <a class="home" href="./">&larr; Demos</a>
    <h1>Lighting and materials</h1>
    <p>
      The top row is one card in each material, rocking so the sheen slides
      across it. <strong>Drag the light</strong> round with the sliders, or
      <strong>pick a card up</strong> and watch its shadow fall away from the
      light - further and softer the higher it is.
    </p>
    <div id="board"></div>
    <p id="note"></p>
    <div class="row">
      <label>light from <input type="range" id="azimuth" min="-180" max="180" step="1" value="-35" /><code id="azimuth-value"></code></label>
      <label>height <input type="range" id="elevation" min="12" max="90" step="1" value="50" /><code id="elevation-value"></code></label>
      <label>ambient <input type="range" id="ambient" min="0" max="1" step="0.05" value="0.45" /><code id="ambient-value"></code></label>
    </div>
    <div class="row">
      <label>held card: up <input type="range" id="lift" min="0" max="160" step="1" value="60" /><code id="lift-value"></code></label>
      <label>tilt <input type="range" id="tilt" min="-1.3" max="1.3" step="0.02" value="0.35" /><code id="tilt-value"></code></label>
      <label>roll <input type="range" id="roll" min="-3.14" max="3.14" step="0.02" value="0" /><code id="roll-value"></code></label>
      <label>stock <select id="material"></select></label>
    </div>
    <div class="row">
      <button id="toss">Toss one</button>
      <button id="flip">Flip the row</button>
      <button id="orbit">Orbit the light</button>
      <button id="rock">Rocking: on</button>
      <button id="lit">Light: on</button>
    </div>
    <script type="module" src="./lighting.ts"></script>
  </body>
</html>
